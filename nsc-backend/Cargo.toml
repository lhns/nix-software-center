[package]
name = "nsc-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "sqlite"] }
tokio = { version = "1.28", features = ["net", "io-util", "process", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[features]
# Builds the smoke binary; not part of the shipped package.
smoke = []

[[bin]]
name = "nsc-backend-smoke"
path = "src/bin/smoke.rs"
required-features = ["smoke"]
