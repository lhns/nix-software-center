name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: build package
        run: nix build .#packages.${{ matrix.system }}.nix-software-center -L
      - name: build appstream data
        run: nix build .#packages.${{ matrix.system }}.appstream-data -L
      - name: pkgdb-small check
        run: nix build .#checks.${{ matrix.system }}.pkgdb-small -L

  pkgdb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
      - name: build index
        run: |
          start=$(date +%s)
          nix build .#packages.${{ matrix.system }}.pkgdb -L -o pkgdb
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: report size
        run: |
          nix shell nixpkgs#sqlite nixpkgs#zstd -c bash -c '
            db=$(readlink -f pkgdb)/nixpkgs.db
            {
              echo "### pkgdb ${{ matrix.system }}"
              echo "- pkgs rows: $(sqlite3 "$db" "select count(*) from pkgs")"
              echo "- meta rows: $(sqlite3 "$db" "select count(*) from meta")"
              echo "- raw: $(stat -c %s "$db") bytes"
              echo "- zstd -19: $(zstd -19 -c "$db" | wc -c) bytes"
              echo "- gzip -9: $(gzip -9 -c "$db" | wc -c) bytes"
              echo "- build wall time: $BUILD_SECONDS s"
              echo "- empty pname, version, position: $(sqlite3 "$db" "select (select count(*) from pkgs where length(pname) = 0), (select count(*) from pkgs where length(version) = 0), (select count(*) from meta where length(position) = 0)")"
              echo "- column bytes (description, longdescription, license, platforms, maintainers):"
              sqlite3 "$db" "select sum(length(description)), sum(length(longdescription)), sum(length(license)), sum(length(platforms)), sum(length(maintainers)) from meta"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          '

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: test backend
        run: cargo test -p nsc-backend --locked
      - name: build smoke binary
        run: cargo build -p nsc-backend --features smoke --locked
